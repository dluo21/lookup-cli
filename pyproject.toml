[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookup-cli"
version = "0.1.0"
description = "Unified identity/asset lookup CLI across Okta, Jira, Jamf, allwhere, and future services"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Declared explicitly rather than relied on transitively via
    # pydantic-settings: PluginConfig.from_env() imports it directly so
    # plugins can see credentials written to .env but never exported.
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
lookup-cli = "lookup_cli.cli:app"

# Core ships one built-in plugin (echo) used to prove the framework works
# in Stage 0. Real service plugins register under this same entry-point
# group from their own packages (see plugins/*/pyproject.toml).
[project.entry-points."lookup_cli.plugins"]
echo = "lookup_cli.plugins.echo_builtin:EchoPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `plugins` is included so each connector package's own tests run in the
# default suite and in CI. It requires importlib import mode: the root
# `tests/` package and every `plugins/*/tests/` package share the module
# name `tests`, which collides under pytest's default prepend mode.
testpaths = ["tests", "plugins"]
# --strict-markers: a typo'd or unregistered marker on a plugin's tests
# would otherwise silently exclude them from that stage's marker run.
addopts = "--import-mode=importlib --strict-markers"
# `fetch()` is async, so connector tests are async. auto mode means a plain
# `async def test_...` just runs -- no per-test decorator for plugin authors
# to remember and no silently-skipped coroutine tests.
asyncio_mode = "auto"
markers = [
    "plugin_framework: Stage 0 - plugin registry/discovery",
    "cache: Stage 1 - cache and data model",
    "okta: Stage 2 - Okta connector",
    "jira: Stage 3 - Jira connector",
    "jamf: Stage 4 - Jamf connector",
    "allwhere: Stage 6 - allwhere connector",
    "cairo: CAIRO (TPRM) vendor/application connector",
    "cli: Stage 7 - aggregation CLI",
]
