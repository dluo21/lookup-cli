# gitleaks configuration
#
# Keep the default ruleset; add narrow exceptions only for synthetic
# credentials that the secret-scrubbing tests must contain in order to
# prove those credentials get redacted. See src/lookup_cli/redaction.py.
#
# Exceptions are matched by the exact fixture value, not by file path, so a
# real credential accidentally pasted into a test file is still caught.

[extend]
useDefault = true

[allowlist]
description = "Synthetic credential fixtures in the redaction tests"
regexes = [
  # The canonical jwt.io example token, used to prove safe_error() strips a
  # bearer assertion of the shape server-to-server auth produces.
  # Payload decodes to {"sub":"jdoe"}; it is signed with the public example
  # key and grants nothing.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJqZG9lIn0\.[A-Za-z0-9_-]+''',
]
